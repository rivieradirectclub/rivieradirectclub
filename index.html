<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Riviera Direct Club - Luxury Hotel Agency</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top{padding:50px 20px 20px;text-align:center;width:100%;background:radial-gradient(600px at 50% 0%, #1a1a1a 0%, #050505 70%)}
.logo-wrap{width:132px;height:132px;margin:0 auto 22px;border-radius:50%;padding:3px;background:linear-gradient(145deg,#e6c88a,#8a6d3b);box-shadow:0 0 30px rgba(230,200,138,0.35)}
.logo-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#000}
h1{font-family:'Cormorant Garamond',serif;font-size:32px;letter-spacing:2px;color:#f3e6c0;font-weight:600}
.sub{margin-top:8px;color:#c9a86a;letter-spacing:4px;font-size:12px;text-transform:uppercase;font-weight:300}
.divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,#c9a86a,transparent);margin:26px auto}
.container{width:100%;max-width:380px;padding:0 20px 40px}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.07),rgba(255,255,255,0.02));border:1px solid rgba(201,168,106,0.18);border-radius:22px;padding:22px;backdrop-filter:blur(12px)}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:17px;border-radius:14px;text-decoration:none;font-weight:700;font-size:13.5px;letter-spacing:0.5px;margin-bottom:11px;transition:all 0.25s ease}
.btn:active{transform:scale(0.98)}
.btn-call{background:linear-gradient(135deg,#1e8a4c,#115a30);color:#fff;box-shadow:0 8px 20px rgba(30,138,76,0.35)}
.btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;box-shadow:0 8px 20px rgba(37,211,102,0.3)}
.btn-ig{background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);color:#fff;box-shadow:0 8px 20px rgba(214,41,118,0.35)}
.btn-tg{background:linear-gradient(135deg,#2AABEE,#229ED9);color:#fff;box-shadow:0 8px 20px rgba(42,171,238,0.3)}
.btn-mail{background:#141414;color:#e6c88a;border:1px solid rgba(230,200,138,0.25)}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.note{margin-top:18px;text-align:center;color:#666;font-size:11px;letter-spacing:1px}
</style>
</head>
<body>
<div class="top">
<div class="logo-wrap"><img src="logo.jpg" alt="Riviera Direct Club"></div>
<h1>RIVIERA DIRECT CLUB</h1>
<div class="sub">Luxury Hotel Agency</div>
<div class="divider"></div>
</div>
<div class="container">
<div class="card">

<a href="https://wa.me/393331977655" class="btn btn-wa">💬 WHATSAPP DIRETTO</a>
<a href="https://instagram.com/rivieradirectclub" target="_blank" class="btn btn-ig">📸 INSTAGRAM</a>
<a href="https://t.me/RivieraDirectClub" class="btn btn-tg">✈️ TELEGRAM</a>
<a href="mailto:rivieradirectclub@gmail.com" class="btn btn-mail">📧 EMAIL</a>

<div class="note">LIGURIA • COSTA AZZURRA • EXCLUSIVE STAYS</div>
